<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hello Home Kochbox</title>
    <meta name="theme-color" content="#2e7d32">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="data:application/json;charset=utf-8,%7B%22name%22%3A%22Hello%20Home%20Kochbox%22%2C%22short_name%22%3A%22Kochbox%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f4f6f8%22%2C%22theme_color%22%3A%22%232e7d32%22%7D">
    <style>
        :root {
            --primary: #2e7d32;
            --primary-light: #e8f5e9;
            --secondary: #d84315;
            --accent: #f57c00;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #212529;
            --text-muted: #6c757d;
            --border: #e9ecef;
            --shadow: 0 4px 12px rgba(0,0,0,0.06);
            --radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }

        body { background-color: var(--bg); color: var(--text); padding-bottom: 90px; line-height: 1.5; }

        #pinOverlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: #ffffff; z-index: 9999; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            padding: 24px; text-align: center;
        }
        .pin-card {
            background: var(--bg); padding: 32px 24px; border-radius: var(--radius);
            box-shadow: var(--shadow); border: 1px solid var(--border); width: 100%; max-width: 340px;
        }
        .pin-icon { font-size: 3rem; margin-bottom: 12px; }
        .pin-title { font-size: 1.3rem; font-weight: 800; color: var(--primary); margin-bottom: 6px; }
        .pin-subtitle { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 20px; }
        .pin-input {
            width: 100%; padding: 14px; font-size: 1.5rem; letter-spacing: 8px; text-align: center;
            border: 2px solid var(--border); border-radius: 12px; outline: none; transition: all 0.2s;
            margin-bottom: 16px; background: #fff;
        }
        .pin-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(46,125,50,0.15); }
        .pin-btn {
            width: 100%; padding: 14px; background: var(--primary); color: #fff; border: none;
            border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.2s;
        }
        .pin-btn:active { transform: scale(0.98); }
        .pin-error { color: var(--secondary); font-size: 0.85rem; font-weight: 600; margin-top: 12px; display: none; }

        header {
            position: sticky; top: 0; z-index: 100; background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border); padding: 12px 16px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .brand { font-size: 1.25rem; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        
        .week-selector {
            display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px; background: #fff;
            border-bottom: 1px solid var(--border); scrollbar-width: none;
        }
        .week-selector::-webkit-scrollbar { display: none; }
        .week-chip {
            padding: 8px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 600;
            white-space: nowrap; background: var(--bg); color: var(--text-muted); border: 1px solid var(--border);
            cursor: pointer; transition: all 0.2s;
        }
        .week-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        .container { max-width: 768px; margin: 0 auto; padding: 16px; }

        .toggle-btn {
            display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px;
            background: #fff; border: 1.5px solid var(--border); border-radius: 20px;
            font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .toggle-btn.active { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }

        .card {
            background: var(--card-bg); border-radius: var(--radius); padding: 20px;
            margin-bottom: 16px; box-shadow: var(--shadow); border: 1px solid var(--border);
        }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .day-badge { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--secondary); letter-spacing: 0.5px; }
        .meal-title { font-size: 1.15rem; font-weight: 700; margin-top: 2px; color: #111; }

        .section-title { font-size: 0.9rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin: 16px 0 8px 0; letter-spacing: 0.5px; }
        .ingredients-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
        .ing-chip { background: var(--bg); padding: 4px 10px; border-radius: 6px; font-size: 0.85rem; border: 1px solid #eee; }

        .step-item { display: flex; gap: 12px; margin-bottom: 10px; cursor: pointer; align-items: flex-start; }
        .step-num { background: var(--primary-light); color: var(--primary); font-weight: 700; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; flex-shrink: 0; margin-top: 2px; }
        .step-text { font-size: 0.95rem; color: #333; flex-grow: 1; }
        .step-item.completed .step-text { text-decoration: line-through; opacity: 0.5; }
        .step-item.completed .step-num { background: #ccc; color: #fff; }

        .kniff-box { background: #fff8e1; border-left: 4px solid var(--accent); padding: 12px; border-radius: 8px; font-size: 0.88rem; color: #5d4037; margin-top: 12px; }
        .baby-box { background: #f3e5f5; border-left: 4px solid #ab47bc; padding: 12px; border-radius: 8px; font-size: 0.88rem; color: #4a148c; margin-top: 10px; display: none; }
        .baby-box.visible { display: block; }

        .check-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 0.95rem; cursor: pointer; }
        .check-item input { width: 18px; height: 18px; accent-color: var(--primary); }
        .check-item.done { text-decoration: line-through; color: var(--text-muted); }

        .tab-bar {
            position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; padding: 8px 0 16px 0; z-index: 100;
        }
        .tab-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); font-size: 0.75rem; text-decoration: none; cursor: pointer; border: none; background: none; flex: 1; }
        .tab-item.active { color: var(--primary); font-weight: 700; }
        .tab-icon { font-size: 1.25rem; }

        textarea.json-editor { width: 100%; height: 320px; font-family: monospace; font-size: 0.85rem; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: #fafafa; }
        .btn { padding: 10px 18px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 8px; }

        .copy-btn { background: var(--secondary); color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="brand">🥗 Hello Home Kochbox</div>
        <button class="toggle-btn" id="babyToggleBtn" onclick="toggleBabyMode()">👶 Baby: AN</button>
    </header>

    <div class="week-selector" id="weekSelector"></div>

    <div class="container">
        <div id="recipesView">
            <div id="mealsContainer"></div>
        </div>

        <div id="pantryView" style="display:none;">
            <div class="card">
                <div class="card-header">
                    <div class="meal-title">🛒 Rewe Einkaufsliste</div>
                    <button class="copy-btn" onclick="copyShoppingList()">📋 Kopieren</button>
                </div>
                <div id="reweList"></div>
            </div>
            <div class="card">
                <div class="card-header">
                    <div class="meal-title">🥫 Smart Pantry (Vorrat)</div>
                </div>
                <div id="pantryList"></div>
            </div>
        </div>

        <div id="adminView" style="display:none;">
            <div class="card">
                <div class="meal-title">⚙️ Rezepte & Einstellungen</div>
                <p style="font-size:0.85rem; color: var(--text-muted); margin: 8px 0 14px 0;">
                    Hier kannst du die Rezeptdaten anpassen.
                </p>

                <div class="section-title">Rezept-Daten (JSON)</div>
                <textarea class="json-editor" id="jsonInput"></textarea>
                <button class="btn" onclick="saveCustomData()">Änderungen lokal speichern</button>
                <button class="btn" style="background:#757575;" onclick="resetData()">Auf Standard zurücksetzen</button>
            </div>
        </div>
    </div>

    <nav class="tab-bar">
        <button class="tab-item active" onclick="switchView('recipesView', this)">
            <span class="tab-icon">📖</span>
            <span>Rezepte</span>
        </button>
        <button class="tab-item" onclick="switchView('pantryView', this)">
            <span class="tab-icon">🛒</span>
            <span>Einkaufen</span>
        </button>
        <button class="tab-item" onclick="switchView('adminView', this)">
            <span class="tab-icon">⚙️</span>
            <span>Bearbeiten</span>
        </button>
    </nav>

    <script>
        const initialData = [{"id": "nov_w1", "title": "Herbst-Mix (Kürbis, Pilze & Lauch)", "month": "November", "week": "Woche 1", "pantry": ["Basmatireis", "Rote Linsen", "Breite Nudeln", "Helle Sojasauce", "Gemüsebrühe-Paste"], "rewe": ["1x Hokkaido-Kürbis (groß)", "2x Stangen Porree / Lauch", "1x Packung braune Champignons (250g)", "1x Packung frische Gnocchi (Kühlregal, 500g)", "1x Packung Salsiccia oder Pancetta (150-200g)", "1x Becher Schmand (200g)", "1x Bio-Zitrone", "1x Halloumi (200g)"], "meals": [{"day": "Tag 1 (Schnell & Raffiniert)", "name": "Gnocchi mit Pilzen, Salsiccia-Nocken & Thymian-Nussbutter-Schmand", "ingredients": ["500g Frische Gnocchi", "150-200g Salsiccia", "1/2 Stange Lauch", "125g Champignons", "40g Butter", "Zweig frischer Thymian", "200g Schmand", "1 Bio-Zitrone"], "steps": ["Das Salsiccia-Brät in kleinen Nocken direkt aus der Haut in eine Pfanne drücken. Bei mittlerer bis hoher Hitze 4-5 Min. kross anbraten, aus der Pfanne nehmen und beiseitestellen.", "Den Lauch gründlich waschen und in feine Ringe schneiden. Die Champignons mit Küchenpapier säubern und vierteln.", "Die Butter im verbliebenen Würzfett bei mittlerer Hitze schmelzen lassen, bis sie leicht schäumt und nussig duftet. Die gezupften Thymianblätter dazugeben und kurz mit anrösten (Beurre Noisette). Gnocchi, Lauchringe und Pilze hinzugeben und 5-6 Min. goldbraun anbraten. Die Salsiccia-Nocken unterheben.", "Den Schmand in einer kleinen Schale mit 1 TL Bio-Zitronenabrieb und 1 TL Zitronensaft glattrühren.", "Die Schmand-Creme unter die heißen Gnocchi schwenken, mit frisch gemahlenem Pfeffer abschmecken und warm anrichten."], "kniff": "Beurre Noisette (Nussbutter): Das Karamellisieren der Milchfeststoffe verleiht eine tief-nussige Note. Die Zitronenschale schneidet ideal durch das Fett von Schmand und Wurst.", "baby": "Gnocchi fürs Baby separat in ungesalzenem Wasser weich kochen und leicht zerdrücken (nicht in der Pfanne mitbraten, da sie sonst zäh werden). Lauch und Pilze vor dem Salzen & Würzen sowie vor der gewürzten Salsiccia abzweigen."}, {"day": "Tag 2 (Schnell & Raffiniert)", "name": "Umami-Kürbis-Reis-Pfanne mit Sesam-Sojasauce-Emulsion", "ingredients": ["250g Basmatireis", "1/4 Hokkaido-Kürbis", "125g Champignons", "2 EL Helle Sojasauce", "Pflanzenöl"], "steps": ["Basmatireis nach Packungsanweisung in leicht gesalzenem Wasser gar kochen. Beim Abgießen 2-3 EL Reiswasser auffangen.", "Den Hokkaido-Kürbis entkernen und in 1 cm große Würfel schneiden. Die Champignons säubern und vierteln.", "Etwas Öl in einer großen Pfanne erhitzen. Kürbis- und Pilzwürfel bei hoher Hitze 5-7 Min. scharf anbraten, bis der Kürbis weich ist und Röstkanten zeigt.", "Den gekochten Reis in die Pfanne geben und 2 Min. unter Rühren kräftig mitrösten.", "Mit 2 EL Sojasauce und dem aufbewahrten Reiswasser ablöschen. Unter Schwenken 1 Min. einkochen lassen, bis der Reis glänzt."], "kniff": "Röststoffe & Maillard-Reaktion: Hohe Hitze karamellisiert den Kürbis. Stärkehaltiges Reiswasser bindet die Sojasauce zu einem glänzenden Glaze.", "baby": "Kürbis & Pilze ungewürzt weichbraten. Mit purem Reis servieren."}, {"day": "Tag 3 (Schnell & Deftig)", "name": "Tagliatelle mit Lauch-Fondue, Muskat & Pfeffer-Crunch", "ingredients": ["250g Breite Nudeln", "1/2 Stange Lauch", "100g Schmand", "Muskatnuss", "Bio-Zitrone", "Ganzes schwarzes Pfefferkorn"], "steps": ["Nudeln in einem großen Topf in reichlich kochendem Salzwasser aufsetzen.", "Den Lauch gründlich waschen und in hauchfeine Ringe schneiden. Genau 2 Min. vor Ende der Nudelkochzeit die Lauchringe direkt mit in das Nudelwasser geben.", "Nudeln und Lauch abgießen, dabei 1 Tasse (ca. 100 ml) Nudelwasser auffangen.", "Nudeln & Lauch zurück in den Topf geben. Schmand, 3-4 EL Nudelwasser, eine Prise Muskatnuss und etwas Zitronenabrieb einrühren, bis eine seidige Sauce entsteht.", "Ganzen schwarzen Pfeffer im Mörser oder unter einem schweren Pfannenboden grob zerkleinern und trocken in einer Pfanne 1-2 Min. anrösten. Die Nudeln auf Tellern anrichten und mit dem Pfeffer-Crunch bestreuen."], "kniff": "Emulgieren mit Pasta-Wasser: Stärkereiches Nudelwasser verbindet Fett und Wasser zu einer cremigen Sauce, die an der Pasta haftet.", "baby": "Nudeln und weichen Lauch ungesalzen vor Brühe/Würze abzweigen."}, {"day": "Tag 4 (Das Highlight)", "name": "Krosser Halloumi auf Balsamico-Linsen mit geschmolzenem Lauch", "ingredients": ["200g Halloumi", "1 Stange Lauch", "200g Rote Linsen", "Gemüsebrühe", "Balsamico-Essig", "Butter"], "steps": ["Die Linsen in 600 ml Gemüsebrühe ca. 15-20 Min. weichköcheln. Am Ende mit 1-2 EL Balsamico abschmecken.", "Den Lauch in Ringe schneiden und in einer separaten Pfanne mit etwas Butter 10 Min. sanft schmoren ('schmelzen').", "Den Halloumi in dicke Scheiben schneiden und in einer beschichteten Pfanne ohne Öl von beiden Seiten goldbraun und kross anbraten.", "Komponenten anrichten: Balsamico-Linsen als Basis auf tiefe Teller geben, den Lauch daneben platzieren und mit dem Halloumi toppen."], "kniff": "Plated Dish (Komponenten-Gericht): Der krosse, sehr salzige Halloumi profitiert extrem von der erdigen Säure der Balsamico-Linsen und der Süße des geschmolzenen Lauchs.", "baby": "Weiche Linsen und Lauch ungesalzen abgeben. Halloumi aussparen (zu salzig)."}]}, {"id": "nov_w2", "title": "Herbst-Mix (Spitzkohl, Möhren & Hack)", "month": "November", "week": "Woche 2", "pantry": ["Basmatireis", "Helle Sojasauce", "Breite Nudeln / Tagliatelle", "Tomatenmark", "Erdnussmus"], "rewe": ["1x Spitzkohl", "1x Bund Möhren", "1x Rinderhack (400g)", "1x Feta (200g)", "1x Bio-Zitrone", "1x Hähnchenbrust (Zwischeneinkauf Tag 3/4, 300g)"], "meals": [{"day": "Tag 1 (Schnell & Würzreich)", "name": "Spitzkohl-Hack-Pfanne mit Erdnuss-Sojasauce-Glaze & Zitronenzeste", "ingredients": ["Basmatireis", "1/2 Spitzkohl", "1/2 Bund Möhren", "200g Rinderhack", "2 EL Erdnussmus", "2 EL Sojasauce", "Bio-Zitrone"], "steps": ["Reis nach Packungsanleitung kochen. Spitzkohl vom Strunk befreien und in feine Streifen schneiden. Möhren schälen und feinst raspeln.", "Das Rinderhack flach in eine knallheiße Pfanne mit etwas Öl drücken und 3-4 Min. unberührt braten, bis braune Krusten entstehen, erst dann zerkleinern.", "Kohlstreifen und Möhrenraspel hinzufügen und bei mittlerer Hitze 5 Min. knackig-weich mitdünsten.", "In einer kleinen Tasse 2 EL Erdnussmus, 2 EL Sojasauce, 1 TL Zitronenabrieb und 2 EL heißes Reiswasser glattrühren.", "Das Glaze unter das Gemüse-Hack schwenken, mit Salz und Pfeffer abschmecken und auf dem Reis anrichten."], "kniff": "Maillard-Reaktion: Hackfleisch flach in die heiße Pfanne drücken und scharf anbraten für intensive Umami-Tiefe.", "baby": "Möhrenraspel und ungewürztes Hack mit Reis vor der Sauce & Zitrone abzweigen. Erdnussmus pur dazu reichen."}, {"day": "Tag 2 (Schnell & Deftig)", "name": "Tagliatelle-Ragu vom Spitzkohl mit karamellisiertem Tomatenmark & Feta-Schnee", "ingredients": ["Tagliatelle", "200g Rinderhack", "1/2 Spitzkohl", "2 EL Tomatenmark", "100g Feta"], "steps": ["Tagliatelle in kochendem Salzwasser al dente kochen.", "Das restliche Rinderhack in einer Pfanne kräftig anbraten, den restlichen geschnittenen Spitzkohl unterrühren und 3 Min. mitbraten.", "Das Fleisch und Gemüse an den Pfannenrand schieben. In der freien Pfannenmitte 2 EL Tomatenmark 1-2 Min. scharf rösten, bis es tiefrot duftet.", "Mit einer großen Kelle Nudelwasser ablöschen und alles zu einer sämigen Ragu-Sauce vermengen.", "Die abgetropften Nudeln untermischen. Auf den Tellern anrichten und den Feta sehr fein darüber reiben ('Feta-Schnee')."], "kniff": "Karamellisieren & Feta-Schnee: Tomatenmark verliert Säure und wird süß-fruchtig beim Mitrösten. Geriebener Feta schmilzt sanft.", "baby": "Nudeln und ungewürztes Kohl-Hack-Gemisch abzweigen (ohne salzigen Feta)."}, {"day": "Tag 3 (Schnell & Leicht)", "name": "Seidige Möhren-Erbs-Velouté auf Reis oder Tagliatelle", "ingredients": ["Restliche Möhren", "Gemüsebrühe", "1 TL Erdnussmus", "Zitronensaft"], "steps": ["Die verbliebenen Möhren schälen, feinst raspeln und in einer kleinen Pfanne mit etwas Öl 2 Min. andünsten.", "Mit 150 ml Gemüsebrühe und 1 TL Erdnussmus auffüllen und 5 Min. leicht köcheln lassen.", "Mit einem Pürierstab oder Schneebesen samtig aufschlagen/pürieren.", "Die Sauce über verbliebenen Reis oder Nudeln geben und mit etwas frischem Zitronensaft abschmecken."], "kniff": "Pflanzliche Bindung: Erdnussmus wirkt durch Fett und Eiweiß als natürlicher Emulgator für eine samtige Velouté.", "baby": "Ungesalzener Möhrenbrei mit einem Tropfen Pflanzenöl ist ideal fürs Baby."}, {"day": "Tag 4 (Das Highlight)", "name": "Röstaromatische Ofen-Möhren auf samtiger Feta-Creme mit Hähnchenbrust", "ingredients": ["Möhren", "100g Feta", "Hähnchenbrust (Zwischeneinkauf)", "Milch oder Wasser", "Olivenöl"], "steps": ["Backofen auf 220°C Ober-/Unterhitze vorheizen. Möhren schälen, der Länge nach halbieren und auf einem Backblech mit Öl 20 Min. rösten.", "Den restlichen Feta mit 2 EL warmem Wasser/Milch im Mixer zu einer samtigen, glatten Creme pürieren.", "Die Hähnchenbrust in einer Pfanne kross anbraten und durchgaren. Danach in Tranchen (Scheiben) schneiden.", "Anrichten: Die kühle Feta-Creme als Spiegel auf flachen Tellern verstreichen, die heißen Ofen-Möhren und Hähnchen-Tranchen getrennt darauflegen."], "kniff": "Plated Dish: Die kühle Feta-Creme bildet den perfekten Kontrast zu heißem Ofengemüse und frisch gebratenem Geflügel.", "baby": "Weich gebackene Ofenmöhren und durchgegartes Hähnchen als Fingerfood geben. Feta-Creme aussparen."}]}, {"id": "nov_w3", "title": "Herbst-Mix (Lachs, Süßkartoffel, Rote Bete & Spinat)", "month": "November", "week": "Woche 3", "pantry": ["Rote Linsen", "Breite Nudeln / Tagliatelle", "Balsamico-Essig", "Walnüsse", "Gemüsebrühe-Paste"], "rewe": ["2x frisches Lachsfilet mit Haut (250-300g)", "2x große Süßkartoffeln", "1x Beutel Babyspinat (125g)", "1x Rote Bete vorgekocht (500g)", "1x Becher Ricotta (250g)", "1x Bio-Zitrone"], "meals": [{"day": "Tag 1 (Schnell & Feierabend-Gourmet)", "name": "Knuspriges Lachsfilet auf Zitronen-Ricotta-Tagliatelle & Babyspinat", "ingredients": ["Tagliatelle", "2 Lachsfilets", "60g Babyspinat", "125g Ricotta", "Bio-Zitrone"], "steps": ["Tagliatelle in Salzwasser kochen.", "Lachs auf der Hautseite leicht salzen. In einer Pfanne mit Öl auf der Hautseite 3-4 Min. kross anbraten, dann Herd ausschalten, Fisch wenden und 2 Min. durchziehen lassen.", "Den frischen Spinat, Ricotta und 1 TL Zitronenabrieb mit 3 EL Nudelwasser unter die heißen Nudeln rühren.", "Die cremigen Nudeln auf Tellern anrichten und das Lachsfilet darauf platzieren."], "kniff": "Fisch auf der Haut braten: Die Fettschicht schützt das Fleisch. Ricotta und Zitronenabrieb verschmelzen zu samtiger Emulsion.", "baby": "Lachsstück abzweigen, gründlich nach Gräten prüfen und zerteilen. Mit ungesalzenen Nudeln und Spinat servieren."}, {"day": "Tag 2 (Schnell & Samtig)", "name": "Süßkartoffel-Linsen-Dal mit Kokos-Frische-Kick", "ingredients": ["1 Süßkartoffel", "200g Rote Linsen", "Gemüsebrühe", "Restlicher Spinat", "Zitronensaft"], "steps": ["Süßkartoffel schälen, würfeln und in einem Topf mit etwas Öl 3 Min. scharf anbraten.", "Linsen dazugeben, mit 500 ml Gemüsebrühe auffüllen und 15 Min. bei mittlerer Hitze weichköcheln.", "Den restlichen Babyspinat unterheben, bis er zusammenfällt, und mit frischem Zitronensaft abschmecken."], "kniff": "Anrösten & Säurebalancierung: Süßkartoffeln vorher anbraten setzt Fruchtzucker frei. Zitronensaft durchbricht die Schwere.", "baby": "Süßkartoffel und Linsen pur vor dem Brühe-Salzen abzweigen (in Wasser weichkochen)."}, {"day": "Tag 3 (Schnell & Deftig)", "name": "Warmes Rote-Bete-Bistro-Gemüse auf Ricotta-Spiegel mit Walnuss-Pangrattato", "ingredients": ["250g Rote Bete", "1 EL Balsamico", "Restlicher Ricotta", "Walnüsse"], "steps": ["Vorgekochte Rote Bete in Spalten schneiden, in einer Pfanne mit etwas Öl erwärmen und mit 1 EL Balsamico ablöschen.", "Den restlichen Ricotta auf flachen Tellern cremig als Spiegel verstreichen.", "Die gehackten Walnüsse in einer kleinen Pfanne ohne Fett 2 Min. trocken anrösten.", "Die warme Bete auf dem Ricotta-Spiegel anrichten und mit den Röst-Walnüssen bestreuen."], "kniff": "Fruchtsäure-Spiel & Pangrattato: Balsamico bringt Fruchtsäure zur Bete, Walnüsse sorgen für nussigen Crunch.", "baby": "Weiche Rote Bete ungesalzen abzweigen. Ricotta dazu reichen (Walnüsse fürs Baby aussparen)."}, {"day": "Tag 4 (Das Highlight)", "name": "Gefüllte Kumpir-Süßkartoffel mit Rote-Bete-Mousse & karamellisierten Walnüssen", "ingredients": ["1 große Süßkartoffel", "250g Rote Bete", "Ricotta", "Walnüsse", "Honig", "Balsamico"], "steps": ["Süßkartoffel mehrmals mit der Gabel einstechen und im Ofen bei 200°C ca. 45 Min. weich garen.", "Rote Bete mit Ricotta und einer Prise Salz im Mixer zu einer feinen pinken Mousse pürieren.", "Walnüsse in einer Pfanne anrösten, mit 1 TL Honig und 1 TL Balsamico glatt karamellisieren.", "Die heiße Süßkartoffel längs aufschneiden, das Innere leicht auflockern, mit Mousse füllen und Walnüssen toppen."], "kniff": "Kumpir & Karamell-Kontrast: Weiches Inneres trifft auf süß-sauer karamellisierte Knusper-Walnüsse.", "baby": "Weiches Süßkartoffelfleisch löffeln (mit etwas Rapsöl verfeinert)."}]}, {"id": "dez_w1", "title": "Winter-Mix (Rotkohl, Kartoffeln & Bratwurst)", "month": "Dezember", "week": "Woche 1", "pantry": ["Preiselbeeren (Glas)", "Senf", "Balsamico-Essig", "Gemüsebrühe-Paste", "Rote Linsen"], "rewe": ["1x Rotkohl (klein)", "1kg Festkochende Kartoffeln", "2x Äpfel", "1x Packung Bratwurst (oder Veggie)", "1x Becher Schlagsahne"], "meals": [{"day": "Tag 1 (Schnell & Wärmend)", "name": "Blitz-Rotkohl-Pfanne mit Apfel & Linsen", "ingredients": ["1/2 Rotkohl", "1 Apfel", "150g Rote Linsen", "Gemüsebrühe", "Balsamico", "Preiselbeeren"], "steps": ["Rotkohl in feine Streifen hobeln, Apfel schälen und würfeln.", "Beides in einem Topf mit etwas Öl 3 Min. anbraten, Linsen und 400 ml Brühe z niff": "Glasieren & Fruit-Cheese-Pairing: Honig hält das Fleisch saftig, Birne + Hartkäse ist ein Bistro-Clou.", "baby": "Puren Reis und durchgegartes Hähnchen vor dem Honig-Schritt abzweigen (Babys dürfen keinen Honig!)."}]}, {"id": "jan_w1", "title": "Wirsing & Umami-Küche", "month": "Januar", "week": "Woche 1", "pantry": ["Basmatireis", "Gnocchi", "Helle Sojasauce", "Orangen"], "rewe": ["1x Wirsing (klein)", "1x Natur-Tofu oder Rinderhack (400g)", "1x Pastinaken (500g)", "1x Chicorée", "1x Skrei / Kabeljau (Zwischeneinkauf Tag 3/4, 300g)", "1x Kräuterseitlinge (200g)", "1x Schmand / Feta"], "meals": [{"day": "Tag 1 (Schnell & Umami)", "name": "Wirsing-Ramen-Pfanne mit Teriyaki-Glaze & Crispy Tofu / Hack", "ingredients": ["Basmatireis", "Wirsing", "200g Tofu/Hack", "2 EL Sojasauce"], "steps": ["Reis kochen. Wirsing in feine Streifen schneiden.", "Tofu würfeln (oder Hack) und zusammen mit den Wirsingstreifen bei hoher Hitze scharf anbraten.", "Mit 2 EL Sojasauce und 2 EL Reiswasser deglasieren und 2 Min. einkochen."], "kniff": "Pan-Deglasieren: Das Lösen des Pfannenansatzes mit Stärkewasser bildet ein tiefes Glaze.", "baby": "Gedünstete Wirsingstreifen und Reis ungesalzen vor der Teriyaki-Sauce abzweigen."}, {"day": "Tag 2 (Schnell & Nussig)", "name": "Pastinaken-Gnocchi in nussiger Beurre Noisette & Salbei", "ingredients": ["Pastinaken", "Gnocchi", "Butter", "Salbei"], "steps": ["Pastinaken schälen, würfeln und in Wasser 10 Min. weichkochen. Gnocchi dazugeben.", "In einer Pfanne Butter erhitzen, bis sie braun nussig duftet.", "Gnocchi, Pastinaken und gezupften Salbei in der Beurre Noisette kross anbraten."], "kniff": "Beurre Noisette: Karamellisierte Milchfeststoffe harmonieren mit süßer Pastinake.", "baby": "Gnocchi fürs Baby separat in ungesalzenem Wasser weich kochen. Mit gekochten Pastinaken servieren."}, {"day": "Tag 3 (Schnell & Fruchtig-Herzhaft)", "name": "Gebratener Chicorée mit Orangen-Glaze & Feta-Schnee", "ingredients": ["Chicorée", "Orangensaft", "Honig", "Feta"], "steps": ["Chicorée halbieren und auf der Schnittfläche in Öl 3 Min. scharf anbraten.", "Mit Orangensaft und 1 TL Honig ablöschen und 5 Min. sanft dünsten.", "Auf Tellern anrichten und mit feingeriebenem Feta-Schnee bestreuen."], "kniff": "Bitterstoff-Balancierung: Anbraten mildert Bitterkeit, Fruchtsäure bringt Balance.", "baby": "Mildes Herzstück des gedünsteten Chicorée ungewürzt mit Reis reichen."}, {"day": "Tag 4 (Das Highlight)", "name": "Skrei auf Seiden-Pastinaken-Creme & Kräuterseitlingen", "ingredients": ["Pastinaken", "Butter", "Kräuterseitlinge", "Skrei / Kabeljau"], "steps": ["Pastinaken kochen und mit kalter Butter spiegelglatt pürieren.", "Pilze in Scheiben schneiden und trocken anbraten.", "Fisch auf der Hautseite kross anbraten, wenden und durchziehen lassen.", "Creme auf Tellern verstreichen, Fisch und Pilze darauf toppen."], "kniff": "Monter au Beurre: Kalte Butter im heißen Püree emulgiert zu seidener Textur.", "baby": "Skrei sanft dünsten, auf Gräten prüfen und mit ungesalzener Pastinaken-Creme servieren."}]}, {"id": "jan_w2", "title": "Die Rosenkohl-Revolution", "month": "Januar", "week": "Woche 2", "pantry": ["Tagliatelle", "Balsamico-Essig", "Rote Linsen", "Brot"], "rewe": ["1x Netz Rosenkohl (500g)", "1x Bacon (150g)", "1x Beutel Grünkohl (200g)", "1x Pecorino (150g)", "1x Champignons (250g)", "1x Schmand (200g)"], "meals": [{"day": "Tag 1 (Schnell & Karamellig)", "name": "Halbierter Ofen-Rosenkohl mit Ahornsirup, Balsamico & Bacon-Crunch", "ingredients": ["Rosenkohl", "Bacon", "Ahornsirup", "Balsamico"], "steps": ["Rosenkohl halbieren, Bacon knusprig ausbraten und beiseitestellen.", "Rosenkohl auf der Schnittfläche in der Pfanne tiefbraun anbraten.", "Mit 1 EL Ahornsirup und 1 EL Balsamico ablöschen, mit Bacon-Crunch bestreuen."], "kniff": "Dry Roasting: Schnittflächen-Braten setzt Zucker frei und mildert Bitterstoffe.", "baby": "Weich gebackene Rosenkohlhälften ungewürzt als Fingerfood (ohne Bacon)."}, {"day": "Tag 2 (Schnell         const DEFAULT_PIN = "1234";

        let currentData = initialData;
        try {
            const saved = localStorage.getItem('hh_kochbox_data');
            if (saved) currentData = JSON.parse(saved);
        } catch (e) {
            console.error("Local data corrupted, falling back to initial data.", e);
            currentData = initialData;
        }
        let activePin = DEFAULT_PIN;
        try { activePin = localStorage.getItem('hh_app_pin') || DEFAULT_PIN; } catch(e){}
        let isUnlocked = true; // Hardcoded true since PIN is removed
        
        let selectedWeekId = currentData[0].id;
        try {
            const savedWeek = localStorage.getItem('hh_selected_week');
            if (savedWeek && currentData.some(w => w.id === savedWeek)) {
                selectedWeekId = savedWeek;
            }
        } catch(e) {}
        let babyMode = true;
        try { babyMode = localStorage.getItem('hh_baby_mode') !== 'false'; } catch(e){}

        function checkLockStatus() {
            const overlay = document.getElementById('pinOverlay');
            if (!overlay) return;
            if (isUnlocked) {
                overlay.style.display = 'none';
                initApp();
            } else {
                overlay.style.display = 'flex';
                const inp = document.getElementById('pinInput');
                if (inp) inp.focus();
            }
        }

        function verifyPin(evt) {
            if (evt) {
                evt.preventDefault();
                if (evt.stopPropagation) evt.stopPropagation();
            }
            const inputEl = document.getElementById('pinInput');
            if (!inputEl) return false;

            const input = inputEl.value.trim();
            let currentActivePin = DEFAULT_PIN;
            try {
                currentActivePin = localStorage.getItem('hh_app_pin') || DEFAULT_PIN;
            } catch(e) {}

            if (input === currentActivePin || input === DEFAULT_PIN || input === "1234") {
                isUnlocked = true;
                try { sessionStorage.setItem('hh_is_unlocked', 'true'); } catch(e){}
                document.getElementById('pinOverlay').style.display = 'none';
                const err = document.getElementById('pinError');
                if (err) err.style.display = 'none';
                initApp();
            } else {
                const err = document.getElementById('pinError');
                if (err) err.style.display = 'block';
                inputEl.value = '';
                inputEl.focus();
            }
            return false;
        }

        function lockApp() {
            isUnlocked = false;
            sessionStorage.removeItem('hh_is_unlocked');
            document.getElementById('pinInput').value = '';
            document.getElementById('pinOverlay').style.display = 'flex';
        }

        function changePin() {
            const newPin = document.getElementById('newPinInput').value.trim();
            if (newPin.length >= 4) {
                activePin = newPin;
                localStorage.setItem('hh_app_pin', newPin);
                alert("PIN erfolgreich geändert! Neuer PIN: " + newPin);
                document.getElementById('newPinInput').value = '';
            } else {
                alert("Bitte einen PIN mit mindestens 4 Zeichen eingeben.");
            }
        }

        function initApp() {
            renderWeekSelector();
            renderCurrentWeek();
            updateBabyBtnUI();
        }

        function renderWeekSelector() {
            const container = document.getElementById('weekSelector');
            container.innerHTML = currentData.map(w => `
                <div class="week-chip ${w.id === selectedWeekId ? 'active' : ''}" onclick="selectWeek('${w.id}')">
                    ${w.month} - ${w.week}
                </div>
            `).join('');
        }

        function selectWeek(id) {
            selectedWeekId = id;
            try { localStorage.setItem('hh_selected_week', id); } catch(e) {}
            renderWeekSelector();
            renderCurrentWeek();
        }

        function toggleBabyMode() {
            babyMode = !babyMode;
            localStorage.setItem('hh_baby_mode', babyMode);
            updateBabyBtnUI();
            renderCurrentWeek();
        }

        function updateBabyBtnUI() {
            const btn = document.getElementById('babyToggleBtn');
            btn.innerHTML = babyMode ? "👶 Baby: AN" : "👶 Baby: AUS";
            btn.classList.toggle('active', babyMode);
        }

        function renderCurrentWeek() {
            const week = currentData.find(w => w.id === selectedWeekId) || currentData[0];
            
            const mealsContainer = document.getElementById('mealsContainer');
            mealsContainer.innerHTML = week.meals.map((m, mIdx) => `
                <div class="card">
                    <div class="card-header">
                        <div>
                            <div class="day-badge">${m.day}</div>
                            <div class="meal-title">${m.name}</div>
                        </div>
                    </div>
                    <div class="section-title">Zutaten</div>
                    <div class="ingredients-list">
                        ${m.ingredients.map(ing => `<span class="ing-chip">${ing}</span>`).join('')}
                    </div>
                    <div class="section-title">Zubereitung</div>
                    <div>
                        ${m.steps.map((s, idx) => `
                            <div class="step-item" onclick="this.classList.toggle('completed')">
                                <div class="step-num">${idx + 1}</div>
                                <div class="step-text">${s}</div>
                            </div>
                        `).join('')}
                    </div>
                    ${m.kniff ? `<div class="kniff-box">💡 <strong>Gastro-Kniff:</strong> ${m.kniff}</div>` : ''}
                    ${m.baby ? `<div class="baby-box ${babyMode ? 'visible' : ''}">👶 <strong>Baby-Share / Familientisch:</strong> ${m.baby}</div>` : ''}
                </div>
            `).join('');

            const checkedState = JSON.parse(localStorage.getItem('hh_checked_' + week.id)) || {};
            
            document.getElementById('reweList').innerHTML = week.rewe.map((item, idx) => `
                <div class="check-item ${checkedState['rewe_' + idx] ? 'done' : ''}" onclick="toggleCheck('${week.id}', 'rewe_${idx}', this)">
                    <input type="checkbox" ${checkedState['rewe_' + idx] ? 'checked' : ''}>
                    <span>${item}</span>
                </div>
            `).join('');

            document.getElementById('pantryList').innerHTML = week.pantry.map((item, idx) => `
                <div class="check-item ${checkedState['pantry_' + idx] ? 'done' : ''}" onclick="toggleCheck('${week.id}', 'pantry_${idx}', this)">
                    <input type="checkbox" ${checkedState['pantry_' + idx] ? 'checked' : ''}>
                    <span>${item}</span>
                </div>
            `).join('');

            document.getElementById('jsonInput').value = JSON.stringify(currentData, null, 2);
        }

        function toggleCheck(weekId, key, el) {
            const checkedState = JSON.parse(localStorage.getItem('hh_checked_' + weekId)) || {};
            checkedState[key] = !checkedState[key];
            localStorage.setItem('hh_checked_' + weekId, JSON.stringify(checkedState));
            el.classList.toggle('done');
            el.querySelector('input').checked = checkedState[key];
        }

                function copyShoppingList() {
            const week = currentData.find(w => w.id === selectedWeekId);
            const text = "🛒 Rewe Einkaufsliste (" + week.month + " " + week.week + "):\n" + week.rewe.map(i => "- " + i).join("\n");
            navigator.clipboard.writeText(text);
            alert("Einkaufsliste in die Zwischenablage kopiert!");
        }

        function switchView(viewId, tabEl) {
            ['recipesView', 'pantryView', 'adminView'].forEach(id => {
                document.getElementById(id).style.display = (id === viewId) ? 'block' : 'none';
            });
            document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
            tabEl.classList.add('active');
        }

        function saveCustomData() {
            try {
                const parsed = JSON.parse(document.getElementById('jsonInput').value);
                currentData = parsed;
                localStorage.setItem('hh_kochbox_data', JSON.stringify(currentData));
                alert("Daten erfolgreich lokal gespeichert!");
                initApp();
            } catch(e) {
                alert("Fehler im JSON-Format: " + e.message);
            }
        }

        function resetData() {
            if(confirm("Möchtest du alle Anpassungen auf den Originalzustand zurücksetzen?")) {
                localStorage.removeItem('hh_kochbox_data');
                currentData = initialData;
                initApp();
            }
        }

        
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW failed', err));
            });
        }

        document.addEventListener('DOMContentLoaded', initApp);
    if(document.readyState === 'complete' || document.readyState === 'interactive') { initApp(); }
    </script>
